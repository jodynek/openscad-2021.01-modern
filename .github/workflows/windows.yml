name: Windows build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  QT_VERSION: "6.10.3"
  # vcpkg binaries are cached in the GitHub Actions cache (x-gha); the first run builds ~110
  # packages (about an hour), later runs restore them in minutes
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 240
    env:
      # empty unless the repository has the secret: the SignPath step is skipped then
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Export GitHub Actions cache endpoint for vcpkg
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Cache Qt and QScintilla
        id: qt-cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\Qt
          key: qt-${{ env.QT_VERSION }}-msvc2022_64-qscintilla-2.14.1-v1

      - name: Install Qt 6 and build QScintilla
        if: steps.qt-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File tools\install-qt6.ps1 -QtRoot "${{ github.workspace }}\Qt" -QtVersion ${{ env.QT_VERSION }} -WorkDir "${{ runner.temp }}\qscintilla"

      - name: Build headless (vcpkg dependencies + command-line openscad.exe)
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File build-msvc.ps1 -Preset x64-headless -VcpkgRoot "${{ github.workspace }}\vcpkg"

      - name: Smoke tests (headless)
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File tests\smoke\run-smoke.ps1 -SkipOpenGL

      - name: Build GUI (Qt 6)
        shell: pwsh
        env:
          QT6_ROOT: ${{ github.workspace }}\Qt\${{ env.QT_VERSION }}\msvc2022_64
        run: powershell -ExecutionPolicy Bypass -File build-msvc.ps1 -Preset x64-gui -VcpkgRoot "${{ github.workspace }}\vcpkg"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File installer\build-installer.ps1

      - name: Upload installer artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: OpenSCAD-2021.01-modern-win64-setup
          path: build\installer\OpenSCAD-*-win64-setup.exe
          if-no-files-found: error

      # Code signing through SignPath (https://signpath.org). Runs only when the repository has
      # the SIGNPATH_API_TOKEN secret and the SIGNPATH_ORGANIZATION_ID / SIGNPATH_PROJECT_SLUG /
      # SIGNPATH_POLICY_SLUG variables configured; otherwise the unsigned installer is published.
      - name: Sign installer with SignPath
        if: ${{ github.event_name != 'pull_request' && env.SIGNPATH_API_TOKEN != '' }}
        id: signpath
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: build\installer-signed

      - name: Upload signed installer artifact
        if: ${{ steps.signpath.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: OpenSCAD-2021.01-modern-win64-setup-signed
          path: build\installer-signed\*.exe

      - name: Publish release (tag push)
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/installer-signed/*.exe
            build/installer/OpenSCAD-*-win64-setup.exe
          fail_on_unmatched_files: false
          generate_release_notes: true
