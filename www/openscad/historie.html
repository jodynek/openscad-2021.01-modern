<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Historie změn – OpenSCAD 2021.01 modernizovaný build</title>
<link rel="icon" type="image/png" href="img/icon.png">
<style>
  :root { --bg:#f6f7fb; --card:#fff; --text:#1d2433; --muted:#5d667a; --accent:#2563eb; --accent-text:#fff; --line:#e2e6ef; --code:#eef1f8; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12151c; --card:#1b2030; --text:#e6e9f2; --muted:#98a1b8; --accent:#6ea0ff; --accent-text:#0d1220; --line:#2a3145; --code:#0e111a; }
  }
  * { box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.6 system-ui,'Segoe UI',sans-serif; }
  a { color:var(--accent); }
  .wrap { max-width:960px; margin:0 auto; padding:0 20px; }
  .shot { display:block; width:100%; height:auto; border-radius:12px; border:1px solid var(--line); background:#000; }
  header { padding:56px 0 36px; text-align:center; }
  header img { width:80px; height:80px; margin:0 auto 14px; }
  h1 { margin:0 0 8px; font-size:36px; }
  .lead { color:var(--muted); max-width:640px; margin:0 auto 24px; }
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:10px; background:var(--accent); color:var(--accent-text);
         text-decoration:none; font-weight:700; padding:13px 26px; border-radius:10px; border:2px solid transparent; transition:transform .15s; }
  .btn:hover { transform:translateY(-2px); }
  .btn svg { width:20px; height:20px; fill:currentColor; }
  .btn-ghost { background:transparent; color:var(--text); border-color:var(--line); }
  .hero-btns { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
  .version-note { color:var(--muted); font-size:14px; margin-top:12px; }
  section { margin:44px 0; }
  h2 { font-size:24px; margin:0 0 8px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px 18px; }
  .card h3 { margin:0 0 6px; font-size:16px; }
  .card p { margin:0; color:var(--muted); font-size:15px; }
  code { background:var(--code); padding:1px 6px; border-radius:6px; font-size:14px; }
  pre { background:var(--code); border:1px solid var(--line); border-radius:12px; padding:14px 16px; overflow:auto; font-size:14px; line-height:1.5; }
  pre code { background:none; padding:0; }

  /* vsechny funkce: sbalene kategorie (jako u jCmd) */
  .allfeat-head { display:flex; flex-wrap:wrap; align-items:center; gap:10px 14px; margin:28px 0 12px; }
  .allfeat-head h3 { margin:0; font-size:19px; flex:1 0 auto; }
  .btn-small { font:inherit; font-size:14px; padding:8px 14px; border-radius:10px; border:1px solid var(--line);
               background:var(--card); color:var(--text); cursor:pointer; }
  .btn-small:hover { border-color:var(--accent); }
  .allfeat { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr)); gap:10px; align-items:start; }
  .allfeat details { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:0 16px; }
  .allfeat details[open] { padding-bottom:10px; }
  .allfeat summary { cursor:pointer; padding:12px 0; font-weight:700; list-style:none; display:flex; justify-content:space-between; gap:10px; }
  .allfeat summary::-webkit-details-marker { display:none; }
  .allfeat summary::after { content:'+'; color:var(--muted); font-weight:400; }
  .allfeat details[open] summary::after { content:'−'; }
  .allfeat summary .count { color:var(--muted); font-weight:400; font-size:14px; margin-left:auto; }
  .allfeat ul { margin:0; padding-left:18px; color:var(--muted); font-size:15px; }
  .allfeat li { margin:3px 0; }

  /* stahovani (stejne jako u jCmd) */
  .downloads { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(290px,100%),1fr)); gap:20px; max-width:1000px; }
  .dl { background:var(--card); border:2px solid var(--line); border-radius:16px; padding:26px; display:flex; flex-direction:column; }
  .dl:hover { border-color:var(--accent); }
  .dl .os { display:flex; align-items:center; gap:12px; }
  .dl .os svg { width:38px; height:38px; fill:var(--text); flex:none; }
  .dl h3 { margin:0; font-size:22px; }
  .dl .kind { color:var(--muted); font-size:14px; }
  .dl ul { margin:18px 0; padding-left:20px; color:var(--muted); font-size:15px; flex:1; }
  .dl .btn { justify-content:center; }
  .dl .meta { margin-top:12px; font-size:13px; color:var(--muted); word-break:break-all; }
  .dl .meta summary { cursor:pointer; }
  .dl.off .btn { pointer-events:none; opacity:.45; }

  table { width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; font-size:15px; }
  td, th { padding:9px 14px; text-align:left; border-bottom:1px solid var(--line); }
  tr:last-child td { border-bottom:0; }
  td:first-child { font-family:ui-monospace,Consolas,monospace; white-space:nowrap; width:1%; }
  footer { color:var(--muted); font-size:14px; text-align:center; padding:20px 0 48px; }

  /* historie zmen */
  .changes { display:flex; flex-direction:column; gap:14px; }
  .release { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px 20px; }
  .release h3 { margin:0; font-size:17px; display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 12px; }
  .release .tag { background:var(--accent); color:var(--accent-text); font-size:12px; font-weight:700; padding:1px 8px; border-radius:20px; }
  .release ul { margin:10px 0 0; padding-left:20px; }
  .release li { margin:3px 0; }
  .muted { color:var(--muted); }
  .backlink { font-size:14px; padding:10px 0; text-align:left; }
  .backlink a { color:inherit; opacity:.85; text-decoration:none; }
  .backlink a:hover { text-decoration:underline; opacity:1; }
  @media (max-width:520px) {
    header { padding-top:32px; }
    h1 { font-size:30px; }
    td, th { padding:8px 10px; }
    td:first-child { white-space:normal; }
  }
</style>
</head>
<body>
<div class="wrap backlink"><a href="index.html">← OpenSCAD 2021.01</a> · <a href="/">Zpět na jodynek.cz</a> · <a href="history.html" hreflang="en">English</a></div>
<div class="wrap">
  <header style="padding-bottom:12px">
    <h1>Historie změn – OpenSCAD 2021.01 modernizovaný build</h1>
    <p class="lead">Všechny vydané verze modernizovaného buildu, od nejnovější ke starším.</p>
  </header>
  <section style="margin-top:0">
    <div class="changes" id="changelog"><p class="muted">Načítám…</p></div>
  </section>
  <footer>© 2026 Petr Jodas · <a href="index.html">OpenSCAD 2021.01</a></footer>
</div>
<script>
  (async () => {
    const box = document.getElementById('changelog');
    const parts = v => String(v).split(/[.-]/).map(n => parseInt(n, 10) || 0);
    const newer = (a, b) => {
      const x = parts(a.version), y = parts(b.version);
      for (let i = 0; i < Math.max(x.length, y.length); i++) { const d = (y[i] || 0) - (x[i] || 0); if (d) return d; }
      return 0;
    };
    try {
      const r = await fetch('changelog.json', { cache: 'no-store' });
      if (!r.ok) throw new Error();
      const releases = (await r.json()).filter(e => e.version && e.version !== 'next').sort(newer);
      if (!releases.length) throw new Error();
      box.innerHTML = '';
      releases.forEach((rel, i) => {
        const art = document.createElement('article'); art.className = 'release';
        const h = document.createElement('h3'); h.append(`Verze ${rel.version}`);
        if (rel.date) { const d = document.createElement('span'); d.className = 'muted'; d.style.fontWeight = '400'; d.style.fontSize = '14px'; d.textContent = rel.date; h.append(d); }
        if (i === 0) { const t = document.createElement('span'); t.className = 'tag'; t.textContent = 'aktuální'; h.append(t); }
        const ul = document.createElement('ul');
        (rel.changes || []).forEach(c => { const li = document.createElement('li'); li.textContent = c; ul.append(li); });
        art.append(h, ul); box.append(art);
      });
    } catch { box.innerHTML = '<p class="muted">Historii změn se nepodařilo načíst.</p>'; }
  })();
</script>
</body>
</html>
